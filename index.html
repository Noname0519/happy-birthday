<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title> 🎂 Happy Birthday! </title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f7f3eb;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', 'Poppins', 'Comic Sans MS', cursive, sans-serif;
            margin: 0; overflow: hidden;
        }
        .container {
            background: #fcf9f2; border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08), 0 8px 20px rgba(0, 0, 0, 0.03);
            padding: 20px; position: relative; max-width: 100vw; max-height: 100vh;
        }
        canvas {
            display: block; width: 100%; height: auto; border-radius: 16px;
            background: #fcf9f2; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.02);
            touch-action: none; cursor: pointer;
        }

        /* Texto de felicitación (más pequeño ahora) */
        .text-overlay {
            position: absolute; bottom: 34px; left: 0; width: 100%;
            text-align: center; pointer-events: none; z-index: 10; padding: 0 20px;
        }
        .text-overlay h1 {
            font-size: clamp(1.3rem, 4.5vw, 2.4rem);
            font-weight: 800; color: #2d2a24; letter-spacing: 0.5px;
            text-shadow: 0 3px 10px rgba(255, 215, 215, 0.3); margin: 0; opacity: 0;
        }
        .text-overlay p {
            font-size: clamp(0.72rem, 2vw, 1rem);
            color: #7a6e5d; font-weight: 400; letter-spacing: 1.5px;
            margin-top: 6px; opacity: 0;
            background: rgba(255, 255, 255, 0.5); display: inline-block;
            padding: 3px 14px; border-radius: 40px; backdrop-filter: blur(2px);
            max-width: 90%;
        }
        .text-overlay.revealed h1 { animation: fadeUp .9s ease forwards; }
        .text-overlay.revealed p { animation: fadeUp .9s ease forwards; animation-delay: .3s; }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .status {
            position: absolute; top: 20px; right: 24px; font-size: 0.8rem;
            color: #b5aa99; letter-spacing: 2px; font-weight: 300;
            background: rgba(255, 255, 255, 0.6); padding: 4px 14px; border-radius: 30px;
            backdrop-filter: blur(4px); z-index: 20; border: 1px solid rgba(0,0,0,0.02);
            pointer-events: none;
        }

        @media (max-width: 500px) {
            .container { padding: 12px; border-radius: 20px; }
            .text-overlay { bottom: 20px; }
            .status { top: 12px; right: 16px; font-size: 0.6rem; padding: 2px 10px; }
        }
    </style>
</head>
<body>

<div class="container">
    <canvas id="sketchCanvas" width="800" height="800"></canvas>
    <div class="text-overlay" id="textOverlay">
        <h1>✨ ¡Feliz Cumple! ✨</h1>
        <p>🎂 Que este año te traiga salud, alegría y bonitos recuerdos! </p>
    </div>
    <div class="status" id="statusLabel">✏️ dibujando...</div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('sketchCanvas');
        const ctx = canvas.getContext('2d');
        const statusLabel = document.getElementById('statusLabel');
        const overlay = document.getElementById('textOverlay');

        const size = 800;
        canvas.width = size; canvas.height = size;

        const cx = size / 2;
        const baseY = size * 0.72;

        const PENCIL = '#2b2a27';
        const PENCIL_LIGHT = '#5a554a';
        const PAPER = '#fcf9f2';

        // ---------- Definición de trazos del pastel ----------
        const paths = [];
        function addRect(x, y, w, h) {
            paths.push([[x, y], [x + w, y], [x + w, y + h], [x, y + h], [x, y]]);
        }
        function addLine(x1, y1, x2, y2) { paths.push([[x1, y1], [x2, y2]]); }

        const w1 = 300, h1 = 70, w2 = 250, h2 = 60, w3 = 200, h3 = 50;
        const x1 = cx - w1/2, y1 = baseY - h1;
        const x2 = cx - w2/2, y2 = y1 - h2;
        const x3 = cx - w3/2, y3 = y2 - h3;

        addRect(x1, y1, w1, h1);
        addRect(x2, y2, w2, h2);
        addRect(x3, y3, w3, h3);

        // Crema ondulada arriba
        const creamY = y3;
        const startX = x3 + 10, endX = x3 + w3 - 10, steps = 16;
        const creamPts = [];
        for (let i = 0; i <= steps; i++) {
            const t = i / steps;
            const x = startX + t * (endX - startX);
            creamPts.push([x, creamY + Math.sin(t * Math.PI * 4) * 8 - 4]);
        }
        paths.push(creamPts);
        for (let i = 0; i < 8; i++) {
            const t = (i + 0.5) / 8;
            const x = startX + t * (endX - startX);
            const y = creamY + Math.sin(t * Math.PI * 4) * 8 - 6;
            const pts = []; const r = 6;
            for (let j = 0; j <= 8; j++) {
                const ang = (j / 8) * Math.PI * 2;
                pts.push([x + r * Math.cos(ang), y + r * Math.sin(ang)]);
            }
            paths.push(pts);
        }

        // Vela
        const candleW = 24, candleH = 90;
        const candleX = cx - candleW/2;
        const candleY = y3 - candleH + 8;
        addRect(candleX, candleY, candleW, candleH);
        for (let i = 1; i <= 3; i++) {
            const yRay = candleY + (i / 4) * candleH;
            addLine(candleX + 4, yRay, candleX + candleW - 4, yRay);
        }
        const wickX = cx, wickY = candleY - 4;
        addLine(wickX, wickY, wickX, wickY - 14);

        const totalPaths = paths.length;

        // ---------- Decoración de fondo: estrellas + serpentinas ----------
        const stars = [];
        const starSpots = [
            [120,110],[250,80],[560,90],[690,130],[80,300],[720,300],
            [180,200],[620,210],[400,70],[520,260],[300,150]
        ];
        starSpots.forEach((s,i)=>stars.push({
            x:s[0], y:s[1], r: 7 + (i%3)*4, phase: i*0.7,
            fill: [ '#f4c95d','#f2a6a0','#8fbfb2' ][i%3]
        }));

        const streamers = [
            { sx: 60,  sy: 40, dir:  1, col:'#e8836b' },
            { sx: 120, sy: 30, dir:  1, col:'#f4c95d' },
            { sx: 740, sy: 40, dir: -1, col:'#7fb3a6' },
            { sx: 680, sy: 30, dir: -1, col:'#f2a6a0' },
        ];

        function drawStar(s, now, alpha){
            const tw = 0.55 + 0.45 * Math.sin(now/500 + s.phase); // parpadeo
            ctx.save();
            ctx.globalAlpha = alpha * tw;
            ctx.translate(s.x, s.y);
            ctx.beginPath();
            for (let i = 0; i < 5; i++){
                const a  = -Math.PI/2 + i * 2*Math.PI/5;
                const a2 = a + Math.PI/5;
                ctx.lineTo(Math.cos(a)*s.r, Math.sin(a)*s.r);
                ctx.lineTo(Math.cos(a2)*s.r*0.45, Math.sin(a2)*s.r*0.45);
            }
            ctx.closePath();
            ctx.fillStyle = s.fill; ctx.fill();
            ctx.strokeStyle = PENCIL_LIGHT; ctx.lineWidth = 1; ctx.globalAlpha = alpha*0.5*tw; ctx.stroke();
            ctx.restore();
        }

        function drawStreamer(st, now, alpha){
            ctx.save();
            ctx.globalAlpha = alpha * 0.7;
            ctx.strokeStyle = st.col; ctx.lineWidth = 3;
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.beginPath();
            for (let i = 0; i <= 28; i++){
                const t = i / 28;
                const px = st.sx + st.dir * (44*t + 16*Math.sin(t*9 + now/700));
                const py = st.sy + 170 * t;
                if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.stroke();
            ctx.restore();
        }

        // ---------- Dibujo tipo lápiz ----------
        function drawPath(pts, progress, color = PENCIL, lineWidth = 2.2) {
            if (pts.length < 2) return;
            const totalSegments = pts.length - 1;
            const drawSegments = Math.floor(progress * totalSegments);
            const frac = (progress * totalSegments) - drawSegments;
            ctx.save();
            ctx.strokeStyle = color; ctx.lineWidth = lineWidth;
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.shadowColor = 'rgba(0,0,0,0.02)'; ctx.shadowBlur = 2;
            for (let i = 0; i < drawSegments && i < totalSegments; i++) {
                const p1 = pts[i], p2 = pts[i + 1];
                const vib = 0.6;
                const noiseX = (Math.random() - 0.5) * vib;
                const noiseY = (Math.random() - 0.5) * vib;
                ctx.beginPath();
                ctx.moveTo(p1[0] + (i === 0 ? 0 : noiseX*0.5), p1[1] + (i === 0 ? 0 : noiseY*0.5));
                ctx.lineTo(p2[0] + noiseX, p2[1] + noiseY);
                ctx.stroke();
            }
            if (drawSegments < totalSegments && frac > 0.01) {
                const p1 = pts[drawSegments], p2 = pts[drawSegments + 1];
                ctx.beginPath();
                ctx.moveTo(p1[0], p1[1]);
                ctx.lineTo(p1[0] + (p2[0]-p1[0])*frac + (Math.random()-0.5)*0.8,
                          p1[1] + (p2[1]-p1[1])*frac + (Math.random()-0.5)*0.8);
                ctx.stroke();
            }
            ctx.restore();
        }

        // ---------- Flecha de "haz clic" (estilo lápiz) ----------
        function drawArrowHint(now){
            const bob = Math.sin(now/300) * 7;
            const pulse = 0.55 + 0.45 * (0.5 + 0.5*Math.sin(now/260));
            const start = { x: cx + 150, y: wickY + 55 + bob };
            const ctrl  = { x: cx + 120, y: wickY - 18 + bob };
            const tip   = { x: cx + 30,  y: wickY - 26 + bob };

            ctx.save();
            ctx.globalAlpha = pulse;
            ctx.strokeStyle = PENCIL; ctx.lineWidth = 2.6;
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            // cuerpo de la flecha
            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            ctx.quadraticCurveTo(ctrl.x, ctrl.y, tip.x, tip.y);
            ctx.stroke();
            // punta
            let dx = tip.x - ctrl.x, dy = tip.y - ctrl.y;
            const d = Math.hypot(dx, dy); dx/=d; dy/=d;
            const hl = 16;
            function rot(ax, ay, ang){
                return [ ax*Math.cos(ang)-ay*Math.sin(ang), ax*Math.sin(ang)+ay*Math.cos(ang) ];
            }
            const [lx, ly] = rot(-dx, -dy, 0.5);
            const [rx, ry] = rot(-dx, -dy, -0.5);
            ctx.beginPath();
            ctx.moveTo(tip.x, tip.y); ctx.lineTo(tip.x + lx*hl, tip.y + ly*hl);
            ctx.moveTo(tip.x, tip.y); ctx.lineTo(tip.x + rx*hl, tip.y + ry*hl);
            ctx.stroke();

            // texto de pista
            ctx.globalAlpha = 0.9;
            ctx.fillStyle = PENCIL;
            ctx.font = '600 26px "Comic Sans MS", "Segoe UI", cursive';
            ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            ctx.fillText('¡Toca la vela y pide un deseo! 👈', cx + 120, wickY + 78 + bob);
            ctx.restore();
        }

        // ---------- Llama ----------
        function drawFlame(progress, flicker = 0) {
            const fx = cx, fy = wickY - 14;
            if (progress <= 0) return;
            const baseH = 50, baseW = 28;
            const flick = 1 + 0.08*Math.sin(flicker*4) + 0.04*Math.sin(flicker*7);
            const h = baseH * flick * progress;
            const w = baseW * (0.7 + 0.3*progress) * flick;

            if (progress > 0.5) {
                const gi = (progress - 0.5) * 2;
                const grad = ctx.createRadialGradient(fx, fy - h*0.3, 0, fx, fy - h*0.3, w*1.6);
                grad.addColorStop(0, `rgba(255,220,150,${0.3*gi})`);
                grad.addColorStop(0.4, `rgba(255,180,80,${0.15*gi})`);
                grad.addColorStop(1, `rgba(255,150,50,0)`);
                ctx.save(); ctx.fillStyle = grad; ctx.beginPath();
                ctx.arc(fx, fy - h*0.3, w*1.6, 0, Math.PI*2); ctx.fill(); ctx.restore();
            }

            const grad2 = ctx.createRadialGradient(fx, fy - h*0.2, 0, fx, fy - h*0.3, w);
            grad2.addColorStop(0, 'rgba(255,255,200,0.9)');
            grad2.addColorStop(0.3, 'rgba(255,200,80,0.9)');
            grad2.addColorStop(0.7, 'rgba(255,140,30,0.8)');
            grad2.addColorStop(1, 'rgba(200,80,0,0)');
            ctx.save();
            ctx.shadowColor = 'rgba(255,150,50,0.3)'; ctx.shadowBlur = 30;
            ctx.beginPath();
            ctx.moveTo(fx, fy - h);
            ctx.bezierCurveTo(fx + w*0.9, fy - h*0.4, fx + w*0.5, fy + h*0.1, fx, fy + h*0.1);
            ctx.bezierCurveTo(fx - w*0.5, fy + h*0.1, fx - w*0.9, fy - h*0.4, fx, fy - h);
            ctx.closePath(); ctx.fillStyle = grad2; ctx.fill(); ctx.restore();

            if (progress > 0.7) {
                const p2 = (progress - 0.7) / 0.3;
                const h2 = h*0.5*p2, w2 = w*0.4*p2;
                ctx.save(); ctx.shadowColor = 'rgba(255,200,100,0.5)'; ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.moveTo(fx, fy - h2 - 4);
                ctx.bezierCurveTo(fx + w2*0.8, fy - h2*0.4, fx + w2*0.4, fy + h2*0.1, fx, fy + h2*0.1);
                ctx.bezierCurveTo(fx - w2*0.4, fy + h2*0.1, fx - w2*0.8, fy - h2*0.4, fx, fy - h2 - 4);
                ctx.closePath(); ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fill(); ctx.restore();
            }
        }

        // ---------- Estado / bucle ----------
        let startTime = performance.now();
        const DRAW_DURATION = 4000;
        let phase = 'sketch';        // sketch -> wait -> lit
        let flameStart = null;
        let animFrame;

        function animate(now) {
            const elapsed = now - startTime;
            const progress = Math.min(1, elapsed / DRAW_DURATION);

            ctx.clearRect(0, 0, size, size);
            ctx.fillStyle = PAPER; ctx.fillRect(0, 0, size, size);

            // grano de papel
            ctx.save(); ctx.globalAlpha = 0.04;
            for (let i = 0; i < 300; i++) {
                ctx.beginPath();
                ctx.arc(Math.random()*size, Math.random()*size, Math.random()*1.5, 0, Math.PI*2);
                ctx.fillStyle = '#b5aa99'; ctx.fill();
            }
            ctx.restore();

            // decoración de fondo (aparece junto con el dibujo)
            const decoAlpha = Math.max(0, Math.min(1, (progress - 0.25) / 0.6));
            if (decoAlpha > 0) {
                streamers.forEach(st => drawStreamer(st, now, decoAlpha));
                stars.forEach(s => drawStar(s, now, decoAlpha));
            }

            // pastel
            for (let i = 0; i < totalPaths; i++) {
                const pathStart = i / totalPaths;
                let pathProgress = 0;
                if (progress >= (i + 1) / totalPaths) pathProgress = 1;
                else if (progress > pathStart) pathProgress = (progress - pathStart) / (1 / totalPaths);
                let color = PENCIL, lineW = 2.2;
                if (i > totalPaths - 6) { color = PENCIL_LIGHT; lineW = 1.8; }
                if (i >= totalPaths - 10 && i < totalPaths - 4) { color = PENCIL; lineW = 2.0; }
                if (pathProgress > 0) drawPath(paths[i], pathProgress, color, lineW);
            }

            if (progress >= 1) {
                if (phase === 'sketch') { phase = 'wait'; statusLabel.textContent = '👆 ¡toca la vela!'; }

                if (phase === 'wait') {
                    drawArrowHint(now);
                } else if (phase === 'lit') {
                    const fe = now - flameStart;
                    const flameProgress = Math.min(1, fe / 1000);
                    drawFlame(flameProgress, now / 100);
                    if (flameProgress >= 1 && !overlay.classList.contains('revealed')) {
                        overlay.classList.add('revealed');
                        statusLabel.textContent = '🎂 ¡Listo!';
                        statusLabel.style.color = '#b5838d';
                    }
                }
            } else {
                statusLabel.textContent = `✏️ dibujando ${Math.round(progress*100)}%`;
            }

            animFrame = requestAnimationFrame(animate);
        }

        // ---------- Interacción: clic en la vela ----------
        function toCanvasCoords(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (clientX - rect.left) * (size / rect.width),
                y: (clientY - rect.top)  * (size / rect.height)
            };
        }
        function nearCandle(x, y) {
            return x > candleX - 55 && x < candleX + candleW + 55 &&
                   y > candleY - 80 && y < candleY + candleH + 25;
        }
        function tryLight(clientX, clientY) {
            if (phase !== 'wait') return;
            const p = toCanvasCoords(clientX, clientY);
            if (nearCandle(p.x, p.y)) {
                phase = 'lit'; flameStart = performance.now();
                statusLabel.textContent = '🕯️ encendiendo...';
            }
        }
        canvas.addEventListener('pointerdown', e => tryLight(e.clientX, e.clientY));

        animate(performance.now());

        // ---------- Responsive ----------
        function resizeCanvas() {
            const maxWidth = window.innerWidth - 40;
            const maxHeight = window.innerHeight - 40;
            const s = Math.min(maxWidth, maxHeight, 560);
            canvas.style.width = s + 'px';
            canvas.style.height = s + 'px';
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ---------- Reiniciar con doble clic ----------
        canvas.addEventListener('dblclick', () => {
            if (animFrame) cancelAnimationFrame(animFrame);
            startTime = performance.now();
            phase = 'sketch'; flameStart = null;
            overlay.classList.remove('revealed');
            statusLabel.textContent = '✏️ dibujando...';
            statusLabel.style.color = '#b5aa99';
            animate(performance.now());
        });

        window.addEventListener('beforeunload', () => {
            if (animFrame) cancelAnimationFrame(animFrame);
        });
    })();
</script>
</body>
</html>
