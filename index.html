<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>🎨 Pastel Dibujado 3D</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif; background: #fcf9f2; }
        #info {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 10;
            padding: 0 16px;
            box-sizing: border-box;
        }
        #info h1 {
            font-size: clamp(2.5rem, 9vw, 4.5rem);
            margin: 0;
            color: #2c3e50;
            text-shadow: 4px 4px 0 #f1c40f, 6px 6px 0 rgba(0,0,0,0.1);
            letter-spacing: 2px;
            font-weight: 900;
        }
        #info p {
            font-size: clamp(1rem, 3vw, 1.6rem);
            margin: 8px 0 0;
            color: #2c3e50;
            background: rgba(255, 255, 255, 0.6);
            display: inline-block;
            padding: 4px 18px;
            border-radius: 30px;
            font-weight: bold;
            border: 2px dashed #2c3e50;
        }
        #credit {
            position: absolute;
            bottom: 16px;
            right: 20px;
            color: rgba(44, 62, 80, 0.3);
            font-size: 0.9rem;
            z-index: 10;
            pointer-events: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="info">
        <h1>✏️ ¡Feliz Cumple! ✏️</h1>
        <p>🎨 Coloreado a mano con mucho cariño 🎨</p>
    </div>
    <div id="credit">✧ Estilo Boceto</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Escena (fondo color papel) ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xfcf9f2);

        // --- Cámara ---
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(4, 3.5, 7);
        camera.lookAt(0, 1.5, 0);

        // --- Renderer ---
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // --- Controles ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1.5, 0);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.2;
        controls.enableZoom = true;

        // --- Luces (muy planas para que parezca dibujo) ---
        const ambient = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambient);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(1, 2, 1);
        scene.add(dirLight);
        const backLight = new THREE.DirectionalLight(0xffffff, 0.3);
        backLight.position.set(-1, 0.5, -1);
        scene.add(backLight);

        // --- Suelo (estilo papel) ---
        const groundMat = new THREE.MeshStandardMaterial({
            color: 0xf0ece1,
            roughness: 1,
            metalness: 0,
            transparent: true,
            opacity: 0.4
        });
        const ground = new THREE.Mesh(new THREE.CircleGeometry(3.5, 32), groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.05;
        ground.receiveShadow = false;
        scene.add(ground);

        // --- FUNCIÓN para crear piezas CON BORDES NEGROS ---
        function createOutlinedMesh(geometry, material, posX, posY, posZ, rotX = 0, rotY = 0, rotZ = 0) {
            const group = new THREE.Group();
            
            // Malla rellena
            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            
            // Bordes negros (líneas)
            const edges = new THREE.EdgesGeometry(geometry);
            const lineMat = new THREE.LineBasicMaterial({ color: 0x1a1a1a, linewidth: 2 });
            const wireframe = new THREE.LineSegments(edges, lineMat);
            
            group.add(mesh);
            group.add(wireframe);
            
            group.position.set(posX, posY, posZ);
            group.rotation.set(rotX, rotY, rotZ);
            return group;
        }

        // --- Pastel (colores primarios / vivos para colorear) ---
        const cakeGroup = new THREE.Group();
        const colors = [0xe74c3c, 0xf1c40f, 0x3498db]; // Rojo, Amarillo, Azul
        const heights = [0.8, 0.7, 0.6];
        const radii = [1.5, 1.3, 1.1];

        for (let i = 0; i < 3; i++) {
            const geo = new THREE.CylinderGeometry(radii[i], radii[i], heights[i], 24);
            const mat = new THREE.MeshToonMaterial({
                color: colors[i],
                roughness: 0.6,
                flatShading: false
            });
            
            let yPos = 0;
            for (let j = 0; j < i; j++) yPos += heights[j];
            const yCenter = yPos + heights[i] / 2;
            
            const layerGroup = createOutlinedMesh(geo, mat, 0, yCenter, 0);
            cakeGroup.add(layerGroup);

            // Cremas (con bordes también)
            const creamCount = 10;
            for (let k = 0; k < creamCount; k++) {
                const angle = (k / creamCount) * Math.PI * 2;
                const radius = radii[i] * 0.85;
                const creamGeo = new THREE.SphereGeometry(0.08 + (i === 2 ? 0.12 : 0.07), 8);
                const creamMat = new THREE.MeshToonMaterial({ color: 0xffffff, roughness: 0.8 });
                const creamGroup = createOutlinedMesh(
                    creamGeo, creamMat,
                    Math.cos(angle) * radius,
                    yPos + heights[i] - 0.02,
                    Math.sin(angle) * radius
                );
                cakeGroup.add(creamGroup);
            }
        }
        scene.add(cakeGroup);

        // --- Decoraciones dibujadas (estrellas y bolitas) ---
        const decoMat = new THREE.MeshToonMaterial({ color: 0x2ecc71, roughness: 0.5 });
        const decoGeo = new THREE.SphereGeometry(0.18, 6);
        const deco1 = createOutlinedMesh(decoGeo, decoMat, 0.7, 2.15, 0.7);
        scene.add(deco1);
        const deco2 = createOutlinedMesh(decoGeo, decoMat, -0.7, 2.1, -0.7);
        scene.add(deco2);
        
        // Corazón simple (usamos un cono + esfera, pero para simplificar, otra esfera rosa)
        const heartMat = new THREE.MeshToonMaterial({ color: 0xe91e63 });
        const heartGroup = createOutlinedMesh(new THREE.SphereGeometry(0.15, 6), heartMat, 0, 2.2, -0.9);
        scene.add(heartGroup);

        // --- Vela (con líneas negras) ---
        const candleMat = new THREE.MeshToonMaterial({ color: 0x9b59b6, roughness: 0.5 });
        const candleGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.8, 8);
        const candleGroup = createOutlinedMesh(candleGeo, candleMat, 0, 2.4, 0);
        scene.add(candleGroup);

        // Rayas de la vela (con bordes)
        for (let i = 0; i < 3; i++) {
            const stripeMat = new THREE.MeshToonMaterial({ color: 0xf1c40f });
            const stripeGeo = new THREE.CylinderGeometry(0.22, 0.22, 0.05, 8);
            const stripeGroup = createOutlinedMesh(stripeGeo, stripeMat, 0, 2.1 + i * 0.25, 0);
            scene.add(stripeGroup);
        }

        // --- Llama (dibujada, con bordes) ---
        const flameGroup = new THREE.Group();
        flameGroup.position.set(0, 2.85, 0);

        // Llama exterior (cono redondeado)
        const flameMat = new THREE.MeshToonMaterial({ color: 0xf39c12, emissive: 0xf39c12, emissiveIntensity: 0.1 });
        const flameGeo = new THREE.ConeGeometry(0.2, 0.4, 8);
        const flameMesh = createOutlinedMesh(flameGeo, flameMat, 0, 0.2, 0);
        flameGroup.add(flameMesh);

        // Llama interior (más pequeña)
        const flameMat2 = new THREE.MeshToonMaterial({ color: 0xe67e22, emissive: 0xe67e22, emissiveIntensity: 0.1 });
        const flameGeo2 = new THREE.ConeGeometry(0.1, 0.25, 8);
        const flameMesh2 = createOutlinedMesh(flameGeo2, flameMat2, 0, 0.3, 0);
        flameGroup.add(flameMesh2);

        scene.add(flameGroup);

        // --- Estrellitas flotantes (también con bordes) ---
        const starGroup = new THREE.Group();
        for (let i = 0; i < 25; i++) {
            const size = 0.06 + Math.random() * 0.1;
            const starMat = new THREE.MeshToonMaterial({ 
                color: new THREE.Color().setHSL(Math.random(), 0.8, 0.6) 
            });
            const starGeo = new THREE.OctahedronGeometry(size);
            const sGroup = createOutlinedMesh(
                starGeo, starMat,
                (Math.random() - 0.5) * 6,
                Math.random() * 4,
                (Math.random() - 0.5) * 6
            );
            sGroup.userData = { speed: 0.2 + Math.random() * 0.3, angle: Math.random() * Math.PI * 2 };
            starGroup.add(sGroup);
        }
        scene.add(starGroup);

        // --- Animación ---
        const clock = new THREE.Clock();
        function animate() {
            const delta = clock.getDelta();
            controls.update();

            // Parpadeo y escala de la llama (manteniendo los bordes)
            const flicker = 0.9 + Math.random() * 0.2;
            flameGroup.scale.set(flicker, 1 + Math.random() * 0.15, flicker);

            // Rotación de estrellas
            starGroup.children.forEach(child => {
                child.rotation.x += delta * child.userData.speed;
                child.rotation.y += delta * child.userData.speed * 0.5;
            });

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        // --- Responsive ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        if (/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
            camera.position.set(3.5, 2.5, 5.5);
            controls.target.set(0, 1.2, 0);
        }
    </script>
</body>
</html>
