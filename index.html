<script>
    (function() {
        const canvas = document.getElementById('sketchCanvas');
        const ctx = canvas.getContext('2d');
        const statusLabel = document.getElementById('statusLabel');

        // --- Dimensiones reales (siempre cuadrado para evitar deformaciones) ---
        const size = 800;
        canvas.width = size;
        canvas.height = size;

        // --- Centro y escalado ---
        const cx = size / 2;
        const baseY = size * 0.72; // base del pastel
        const scale = Math.min(1, size / 800);

        // --- Colores de lápiz ---
        const PENCIL = '#2b2a27';
        const PENCIL_LIGHT = '#5a554a';
        const PAPER = '#fcf9f2';

        // --- 1. DEFINICIÓN DE TRAZOS (cada trazo es una serie de puntos [x, y]) ---
        // Para simular el trazo a mano, añadiremos pequeñas vibraciones en la función de dibujo.
        // Aquí definimos las rutas "limpias".
        const paths = [];

        // Helper: añadir un rectángulo (4 lados)
        function addRect(x, y, w, h) {
            // Empezamos desde la esquina superior izquierda, en sentido horario
            paths.push([
                [x, y], [x + w, y], [x + w, y + h], [x, y + h], [x, y]
            ]);
        }

        // Helper: añadir línea simple
        function addLine(x1, y1, x2, y2) {
            paths.push([
                [x1, y1], [x2, y2]
            ]);
        }

        // Helper: arco / curva simple (aproximado con segmentos)
        function addCurve(centerX, centerY, radius, startAngle, endAngle, segments = 10) {
            const pts = [];
            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const angle = startAngle + (endAngle - startAngle) * t;
                pts.push([
                    centerX + radius * Math.cos(angle),
                    centerY + radius * Math.sin(angle)
                ]);
            }
            paths.push(pts);
        }

        // ----- CAPAS DEL PASTEL (de abajo hacia arriba) -----
        const w1 = 300, h1 = 70; // base
        const w2 = 250, h2 = 60; // medio
        const w3 = 200, h3 = 50; // superior

        const x1 = cx - w1/2, y1 = baseY - h1;
        const x2 = cx - w2/2, y2 = y1 - h2;
        const x3 = cx - w3/2, y3 = y2 - h3;

        // 1. Base
        addRect(x1, y1, w1, h1);
        // 2. Capa media
        addRect(x2, y2, w2, h2);
        // 3. Capa superior
        addRect(x3, y3, w3, h3);

        // ----- CREMA / ADORNOS (ondas en la parte superior de cada capa) -----
        // Creamos ondas en la capa superior (y3)
        const creamY = y3;
        const creamPts = [];
        const startX = x3 + 10;
        const endX = x3 + w3 - 10;
        const steps = 16;
        for (let i = 0; i <= steps; i++) {
            const t = i / steps;
            const x = startX + t * (endX - startX);
            const wave = Math.sin(t * Math.PI * 4) * 8;
            creamPts.push([x, creamY + wave - 4]);
        }
        paths.push(creamPts);

        // Pequeños puntos de crema (círculos) en la capa superior
        for (let i = 0; i < 8; i++) {
            const t = (i + 0.5) / 8;
            const x = startX + t * (endX - startX);
            const y = creamY + Math.sin(t * Math.PI * 4) * 8 - 6;
            // Dibujamos un círculo pequeño con 6 puntos
            const pts = [];
            const r = 6;
            for (let j = 0; j <= 8; j++) {
                const ang = (j / 8) * Math.PI * 2;
                pts.push([x + r * Math.cos(ang), y + r * Math.sin(ang)]);
            }
            paths.push(pts);
        }

        // ----- VELA -----
        const candleW = 24, candleH = 90;
        const candleX = cx - candleW/2;
        const candleY = y3 - candleH + 8; // un poco hundida en la crema

        addRect(candleX, candleY, candleW, candleH);

        // Rayas decorativas de la vela (3 líneas horizontales)
        for (let i = 1; i <= 3; i++) {
            const yRay = candleY + (i / 4) * candleH;
            addLine(candleX + 4, yRay, candleX + candleW - 4, yRay);
        }

        // ----- MECHA (pequeña línea) -----
        const wickX = cx;
        const wickY = candleY - 4;
        addLine(wickX, wickY, wickX, wickY - 14);

        // ---- (La llama se dibujará después de completar el boceto) ----

        // Guardamos el número total de trazos
        const totalPaths = paths.length;

        // --- 2. FUNCIÓN DE DIBUJO CON EFECTO "LÁPIZ" ---
        function drawPath(pts, progress, color = PENCIL, lineWidth = 2.2) {
            if (pts.length < 2) return;

            // Calculamos cuántos segmentos dibujar según el progreso
            const totalSegments = pts.length - 1;
            const drawSegments = Math.floor(progress * totalSegments);
            const frac = (progress * totalSegments) - drawSegments;

            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = lineWidth;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // Pequeña sombra de lápiz (opcional)
            ctx.shadowColor = 'rgba(0,0,0,0.02)';
            ctx.shadowBlur = 2;

            for (let i = 0; i < drawSegments && i < totalSegments; i++) {
                const p1 = pts[i];
                const p2 = pts[i + 1];
                // Añadir micro-vibración para efecto "mano alzada"
                const vib = 0.6; // intensidad de la vibración
                const noiseX = (Math.random() - 0.5) * vib;
                const noiseY = (Math.random() - 0.5) * vib;

                ctx.beginPath();
                ctx.moveTo(p1[0] + (i === 0 ? 0 : noiseX * 0.5), p1[1] + (i === 0 ? 0 : noiseY * 0.5));
                const endX = p2[0] + noiseX;
                const endY = p2[1] + noiseY;
                ctx.lineTo(endX, endY);
                ctx.stroke();
            }

            // Dibujar la última porción fraccional
            if (drawSegments < totalSegments && frac > 0.01) {
                const p1 = pts[drawSegments];
                const p2 = pts[drawSegments + 1];
                const fracX = p1[0] + (p2[0] - p1[0]) * frac;
                const fracY = p1[1] + (p2[1] - p1[1]) * frac;
                ctx.beginPath();
                ctx.moveTo(p1[0], p1[1]);
                ctx.lineTo(fracX + (Math.random() - 0.5) * 0.8, fracY + (Math.random() - 0.5) * 0.8);
                ctx.stroke();
            }

            ctx.restore();
        }

        // --- 3. FUNCIÓN PARA DIBUJAR LA LLAMA (al final) ---
        function drawFlame(progress, flicker = 0) {
            const fx = cx;
            const fy = wickY - 14; // punto superior de la mecha

            // Si progress es 0, no dibujamos nada.
            if (progress <= 0) return;

            // Tamaño de la llama
            const baseH = 50;
            const baseW = 28;
            const flick = 1 + 0.08 * Math.sin(flicker * 4) + 0.04 * Math.sin(flicker * 7);
            const h = baseH * flick * progress;
            const w = baseW * (0.7 + 0.3 * progress) * flick;

            // 1. Resplandor exterior (muy suave, estilo "Ins")
            if (progress > 0.5) {
                const glowIntensity = (progress - 0.5) * 2;
                const grad = ctx.createRadialGradient(fx, fy - h * 0.3, 0, fx, fy - h * 0.3, w * 1.6);
                grad.addColorStop(0, `rgba(255, 220, 150, ${0.3 * glowIntensity})`);
                grad.addColorStop(0.4, `rgba(255, 180, 80, ${0.15 * glowIntensity})`);
                grad.addColorStop(1, `rgba(255, 150, 50, 0)`);
                ctx.save();
                ctx.fillStyle = grad;
                ctx.shadowColor = 'transparent';
                ctx.beginPath();
                ctx.arc(fx, fy - h * 0.3, w * 1.6, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // 2. Llama exterior (amarilla/naranja)
            const grad2 = ctx.createRadialGradient(fx, fy - h * 0.2, 0, fx, fy - h * 0.3, w);
            grad2.addColorStop(0, 'rgba(255, 255, 200, 0.9)');
            grad2.addColorStop(0.3, 'rgba(255, 200, 80, 0.9)');
            grad2.addColorStop(0.7, 'rgba(255, 140, 30, 0.8)');
            grad2.addColorStop(1, 'rgba(200, 80, 0, 0)');

            ctx.save();
            ctx.shadowColor = 'rgba(255, 150, 50, 0.3)';
            ctx.shadowBlur = 30;

            ctx.beginPath();
            // Forma de gota / llama
            ctx.moveTo(fx, fy - h);
            ctx.bezierCurveTo(fx + w * 0.9, fy - h * 0.4, fx + w * 0.5, fy + h * 0.1, fx, fy + h * 0.1);
            ctx.bezierCurveTo(fx - w * 0.5, fy + h * 0.1, fx - w * 0.9, fy - h * 0.4, fx, fy - h);
            ctx.closePath();

            ctx.fillStyle = grad2;
            ctx.fill();
            ctx.restore();

            // 3. Llama interior (blanca/amarilla brillante)
            if (progress > 0.7) {
                const p2 = (progress - 0.7) / 0.3;
                const h2 = h * 0.5 * p2;
                const w2 = w * 0.4 * p2;
                ctx.save();
                ctx.shadowColor = 'rgba(255, 200, 100, 0.5)';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.moveTo(fx, fy - h2 - 4);
                ctx.bezierCurveTo(fx + w2 * 0.8, fy - h2 * 0.4, fx + w2 * 0.4, fy + h2 * 0.1, fx, fy + h2 * 0.1);
                ctx.bezierCurveTo(fx - w2 * 0.4, fy + h2 * 0.1, fx - w2 * 0.8, fy - h2 * 0.4, fx, fy - h2 - 4);
                ctx.closePath();
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.fill();
                ctx.restore();
            }

            // 4. Línea de lápiz de la llama (contorno) - para mantener el estilo sketch
            if (progress < 0.9) {
                const pencilProgress = progress / 0.9;
                ctx.save();
                ctx.strokeStyle = PENCIL;
                ctx.lineWidth = 1.5;
                ctx.globalAlpha = Math.min(1, pencilProgress * 1.5);
                ctx.beginPath();
                ctx.moveTo(fx, fy - h * pencilProgress);
                ctx.bezierCurveTo(fx + w * 0.8 * pencilProgress, fy - h * 0.4 * pencilProgress, fx + w * 0.4 * pencilProgress, fy + h * 0.1 * pencilProgress, fx, fy + h * 0.1 * pencilProgress);
                ctx.bezierCurveTo(fx - w * 0.4 * pencilProgress, fy + h * 0.1 * pencilProgress, fx - w * 0.8 * pencilProgress, fy - h * 0.4 * pencilProgress, fx, fy - h * pencilProgress);
                ctx.closePath();
                ctx.stroke();
                ctx.restore();
            }
        }

        // --- 4. BUCLE PRINCIPAL DE ANIMACIÓN ---
        let startTime = performance.now();
        const DRAW_DURATION = 4500; // 4.5 segundos para dibujar todo
        let isComplete = false;
        let animFrame;

        function animate(now) {
            const elapsed = now - startTime;
            let progress = Math.min(1, elapsed / DRAW_DURATION);

            // Limpiar canvas con fondo de papel
            ctx.clearRect(0, 0, size, size);
            
            // Fondo con textura sutil de papel
            ctx.fillStyle = PAPER;
            ctx.fillRect(0, 0, size, size);
            
            // Añadir grano de papel (muy sutil)
            ctx.save();
            ctx.globalAlpha = 0.04;
            for (let i = 0; i < 300; i++) {
                const x = Math.random() * size;
                const y = Math.random() * size;
                const r = Math.random() * 1.5;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fillStyle = '#b5aa99';
                ctx.fill();
            }
            ctx.restore();

            // Calcular progreso por trazo (distribución uniforme)
            const progressPerPath = 1 / totalPaths;
            
            // Dibujar cada trazo
            for (let i = 0; i < totalPaths; i++) {
                const pathStart = i / totalPaths;
                const pathEnd = (i + 1) / totalPaths;
                let pathProgress = 0;
                if (progress >= pathEnd) {
                    pathProgress = 1;
                } else if (progress > pathStart) {
                    pathProgress = (progress - pathStart) / (1 / totalPaths);
                } else {
                    pathProgress = 0;
                }

                // Los primeros trazos (base) son más oscuros, los últimos (crema) un poco más claros
                let color = PENCIL;
                let lineW = 2.2;
                if (i > totalPaths - 6) { // cremas y detalles
                    color = PENCIL_LIGHT;
                    lineW = 1.8;
                }
                // La vela y la mecha un poco más oscuros
                if (i >= totalPaths - 10 && i < totalPaths - 4) {
                    color = PENCIL;
                    lineW = 2.0;
                }

                if (pathProgress > 0) {
                    drawPath(paths[i], pathProgress, color, lineW);
                }
            }

            // --- DIBUJAR LLAMA (después de que el boceto esté completo) ---
            const sketchComplete = progress >= 1;
            if (sketchComplete) {
                // Actualizar estado
                if (!isComplete) {
                    isComplete = true;
                    statusLabel.textContent = '🕯️ encendiendo...';
                }

                // La llama se enciende gradualmente (0 a 1 en 1 segundo) y luego parpadea
                const flameStartTime = startTime + DRAW_DURATION;
                const flameElapsed = now - flameStartTime;
                let flameProgress = Math.min(1, flameElapsed / 1000); // 1 segundo para encenderse
                
                if (flameElapsed > 0) {
                    // Parpadeo continuo
                    const flicker = now / 100;
                    drawFlame(flameProgress, flicker);
                    
                    if (flameProgress >= 1) {
                        statusLabel.textContent = '🎂 ¡Listo!';
                        statusLabel.style.color = '#b5838d';
                    }
                }

            } else {
                // Mostrar progreso en porcentaje
                const percent = Math.round(progress * 100);
                statusLabel.textContent = `✏️ dibujando ${percent}%`;
            }

            animFrame = requestAnimationFrame(animate);
        }

        // Iniciar animación
        animate(performance.now());

        // --- 5. RESPONSIVE / REDIMENSIONADO ---
        function resizeCanvas() {
            const container = canvas.parentElement;
            const maxWidth = window.innerWidth - 40;
            const maxHeight = window.innerHeight - 40;
            const containerSize = Math.min(maxWidth, maxHeight, 560); // límite para que no se vea enorme
            const canvasSize = Math.min(containerSize, 800);
            
            canvas.style.width = canvasSize + 'px';
            canvas.style.height = canvasSize + 'px';
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Pequeño ajuste para móviles: si el canvas es muy pequeño, ajustar la fuente del estado
        if (window.innerWidth < 500) {
            document.querySelector('.status').style.fontSize = '0.6rem';
        }

        // Cleanup (por si el componente se desmonta)
        window.addEventListener('beforeunload', () => {
            if (animFrame) cancelAnimationFrame(animFrame);
        });

        // También permitir reiniciar con doble click (bonus)
        canvas.addEventListener('dblclick', () => {
            // Reiniciar animación
            if (animFrame) cancelAnimationFrame(animFrame);
            startTime = performance.now();
            isComplete = false;
            statusLabel.textContent = '✏️ dibujando...';
            statusLabel.style.color = '#b5aa99';
            animate(performance.now());
        });

        // console.log('✏️ Pastel a lápiz cargado. ¡Doble click para reiniciar el dibujo!');


    })();
</script>

<body>

<div class="container">

<script>
    (function() {
        const canvas = document.getElementById('sketchCanvas');
        const ctx = canvas.getContext('2d');
        const statusLabel = document.getElementById('statusLabel');

        const SIZE = 800;
        canvas.width = SIZE;
        canvas.height = SIZE;

        // Centro y escalas
        const cx = SIZE / 2;
        const baseY = SIZE * 0.72;
        const scale = SIZE / 800;

        // Colores
        const PENCIL = '#2b2a27';
        const PENCIL_LIGHT = '#5a554a';
        const PAPER = '#fcf9f2';
        const PIKA_YELLOW = '#FFDE21';
        const PIKA_CHEEK = '#FF6B6B';
        const PIKA_RED = '#FF0000';
        const PIKA_BROWN = '#6B4F3C';

        // ============================================================
        // 1. DEFINICIÓN DE TRAZOS (Pastel + Vela + Pikachu)
        // ============================================================
        // Cada trazo es un array de puntos [x, y]
        // Para trazos que son curvas, usamos muchos puntos para suavizar
        const paths = [];

        // ---- Helper: añadir un rectángulo ----
        function addRect(x, y, w, h) {
            paths.push([
                [x, y], [x + w, y], [x + w, y + h], [x, y + h], [x, y]
            ]);
        }

        // ---- Helper: añadir una línea ----
        function addLine(x1, y1, x2, y2) {
            paths.push([
                [x1, y1], [x2, y2]
            ]);
        }

        // ---- Helper: añadir curva de Bézier (aproximada con segmentos) ----
        function addBezier(pts, segments = 20) {
            if (pts.length < 4) return;
            const result = [];
            // Algoritmo de Casteljau simplificado para 4 puntos de control
            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const mt = 1 - t;
                // B(t) = (1-t)^3 * P0 + 3*(1-t)^2*t * P1 + 3*(1-t)*t^2 * P2 + t^3 * P3
                const x = mt*mt*mt * pts[0][0] + 3*mt*mt*t * pts[1][0] + 3*mt*t*t * pts[2][0] + t*t*t * pts[3][0];
                const y = mt*mt*mt * pts[0][1] + 3*mt*mt*t * pts[1][1] + 3*mt*t*t * pts[2][1] + t*t*t * pts[3][1];
                result.push([x, y]);
            }
            paths.push(result);
        }

        // ---- Helper: añadir arco/círculo ----
        function addArc(cx, cy, r, startAngle, endAngle, segments = 16) {
            const pts = [];
            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const a = startAngle + (endAngle - startAngle) * t;
                pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
            }
            paths.push(pts);
        }

        // ============================================================
        // 2. TRAZOS DEL PASTEL
        // ============================================================
        // Capas del pastel (de abajo hacia arriba)
        const w1 = 300, h1 = 70;
        const w2 = 250, h2 = 60;
        const w3 = 200, h3 = 50;
        const x1 = cx - w1/2, y1 = baseY - h1;
        const x2 = cx - w2/2, y2 = y1 - h2;
        const x3 = cx - w3/2, y3 = y2 - h3;
        addRect(x1, y1, w1, h1);
        addRect(x2, y2, w2, h2);
        addRect(x3, y3, w3, h3);

        // Crema superior (onda)
        const creamY = y3;
        const startX = x3 + 10, endX = x3 + w3 - 10;
        const creamPts = [];
        for (let i = 0; i <= 16; i++) {
            const t = i / 16;
            const x = startX + t * (endX - startX);
            const wave = Math.sin(t * Math.PI * 4) * 8;
            creamPts.push([x, creamY + wave - 4]);
        }
        paths.push(creamPts);

        // Bolitas de crema
        for (let i = 0; i < 8; i++) {
            const t = (i + 0.5) / 8;
            const x = startX + t * (endX - startX);
            const y = creamY + Math.sin(t * Math.PI * 4) * 8 - 6;
            const pts = [];
            const r = 6;
            for (let j = 0; j <= 8; j++) {
                const a = (j / 8) * Math.PI * 2;
                pts.push([x + r * Math.cos(a), y + r * Math.sin(a)]);
            }
            paths.push(pts);
        }

        // Vela
        const candleW = 24, candleH = 90;
        const candleX = cx - candleW/2;
        const candleY = y3 - candleH + 8;
        addRect(candleX, candleY, candleW, candleH);
        for (let i = 1; i <= 3; i++) {
            const yRay = candleY + (i / 4) * candleH;
            addLine(candleX + 4, yRay, candleX + candleW - 4, yRay);
        }

        // Mecha
        const wickX = cx;
        const wickY = candleY - 4;
        addLine(wickX, wickY, wickX, wickY - 14);

        // ============================================================
        // 3. TRAZOS DE PIKACHU (a la izquierda del pastel)
        // ============================================================
        // Posición base de Pikachu
        const pikaX = cx - 210;
        const pikaY = y3 + 10;
        const s = 0.9; // escala general

        // ---- Cabeza (círculo) ----
        const headR = 70 * s;
        addArc(pikaX, pikaY - 10 * s, headR, 0, Math.PI * 2, 24);

        // ---- Oreja izquierda ----
        const earL = [
            [pikaX - 40 * s, pikaY - 50 * s],
            [pikaX - 65 * s, pikaY - 110 * s],
            [pikaX - 45 * s, pikaY - 125 * s],
            [pikaX - 20 * s, pikaY - 60 * s]
        ];
        addBezier(earL, 16);

        // ---- Oreja derecha ----
        const earR = [
            [pikaX + 40 * s, pikaY - 50 * s],
            [pikaX + 65 * s, pikaY - 110 * s],
            [pikaX + 45 * s, pikaY - 125 * s],
            [pikaX + 20 * s, pikaY - 60 * s]
        ];
        addBezier(earR, 16);

        // ---- Cuerpo (forma de pera) ----
        const body = [
            [pikaX - 50 * s, pikaY + 20 * s],
            [pikaX - 65 * s, pikaY + 70 * s],
            [pikaX - 40 * s, pikaY + 120 * s],
            [pikaX, pikaY + 135 * s],
            [pikaX + 40 * s, pikaY + 120 * s],
            [pikaX + 65 * s, pikaY + 70 * s],
            [pikaX + 50 * s, pikaY + 20 * s]
        ];
        // Convertir a trazo cerrado
        const bodyPts = [];
        for (let i = 0; i < body.length; i++) {
            bodyPts.push(body[i]);
        }
        bodyPts.push(body[0]); // cerrar
        paths.push(bodyPts);

        // ---- Cola (rayo) ----
        const tail = [
            [pikaX + 55 * s, pikaY + 100 * s],
            [pikaX + 95 * s, pikaY + 85 * s],
            [pikaX + 115 * s, pikaY + 55 * s],
            [pikaX + 100 * s, pikaY + 45 * s],
            [pikaX + 85 * s, pikaY + 65 * s],
            [pikaX + 75 * s, pikaY + 75 * s],
            [pikaX + 60 * s, pikaY + 90 * s]
        ];
        paths.push(tail);

        // ---- Ojos ----
        // Ojo izquierdo
        addArc(pikaX - 28 * s, pikaY - 18 * s, 14 * s, 0, Math.PI * 2, 12);
        // Ojo derecho
        addArc(pikaX + 28 * s, pikaY - 18 * s, 14 * s, 0, Math.PI * 2, 12);
        // Brillos de ojos (pequeños círculos)
        addArc(pikaX - 34 * s, pikaY - 24 * s, 5 * s, 0, Math.PI * 2, 8);
        addArc(pikaX + 22 * s, pikaY - 24 * s, 5 * s, 0, Math.PI * 2, 8);

        // ---- Mejillas ----
        addArc(pikaX - 48 * s, pikaY + 10 * s, 14 * s, 0, Math.PI * 2, 12);
        addArc(pikaX + 48 * s, pikaY + 10 * s, 14 * s, 0, Math.PI * 2, 12);

        // ---- Nariz (pequeño triángulo redondeado) ----
        const nose = [
            [pikaX - 4 * s, pikaY - 2 * s],
            [pikaX, pikaY - 10 * s],
            [pikaX + 4 * s, pikaY - 2 * s],
            [pikaX - 4 * s, pikaY - 2 * s]
        ];
        paths.push(nose);

        // ---- Boca (sonrisa) ----
        const mouth = [
            [pikaX - 18 * s, pikaY + 6 * s],
            [pikaX - 10 * s, pikaY + 14 * s],
            [pikaX, pikaY + 18 * s],
            [pikaX + 10 * s, pikaY + 14 * s],
            [pikaX + 18 * s, pikaY + 6 * s]
        ];
        paths.push(mouth);

        // ---- Patas (simples líneas curvas) ----
        // Pata izquierda
        const legL = [
            [pikaX - 30 * s, pikaY + 130 * s],
            [pikaX - 35 * s, pikaY + 155 * s],
            [pikaX - 20 * s, pikaY + 160 * s]
        ];
        paths.push(legL);
        // Pata derecha
        const legR = [
            [pikaX + 30 * s, pikaY + 130 * s],
            [pikaX + 35 * s, pikaY + 155 * s],
            [pikaX + 20 * s, pikaY + 160 * s]
        ];
        paths.push(legR);

        // ---- Rayas de la espalda (decorativas) ----
        const stripe1 = [
            [pikaX - 10 * s, pikaY + 60 * s],
            [pikaX - 15 * s, pikaY + 80 * s],
            [pikaX - 5 * s, pikaY + 90 * s]
        ];
        paths.push(stripe1);
        const stripe2 = [
            [pikaX + 10 * s, pikaY + 60 * s],
            [pikaX + 15 * s, pikaY + 80 * s],
            [pikaX + 5 * s, pikaY + 90 * s]
        ];
        paths.push(stripe2);

        // ============================================================
        // 4. CONTEO DE TRAZOS
        // ============================================================
        const totalPaths = paths.length;

        // ============================================================
        // 5. FUNCIÓN PARA DIBUJAR UN TRAZO CON EFECTO LÁPIZ
        // ============================================================
        function drawPath(pts, progress, color = PENCIL, lineWidth = 2.2) {
            if (pts.length < 2) return;
            const totalSeg = pts.length - 1;
            const drawSeg = Math.floor(progress * totalSeg);
            const frac = (progress * totalSeg) - drawSeg;

            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = lineWidth;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowColor = 'rgba(0,0,0,0.02)';
            ctx.shadowBlur = 2;

            for (let i = 0; i < drawSeg && i < totalSeg; i++) {
                const p1 = pts[i];
                const p2 = pts[i + 1];
                const vib = 0.6;
                const nx = (Math.random() - 0.5) * vib;
                const ny = (Math.random() - 0.5) * vib;
                ctx.beginPath();
                ctx.moveTo(p1[0] + (i===0?0:nx*0.5), p1[1] + (i===0?0:ny*0.5));
                ctx.lineTo(p2[0] + nx, p2[1] + ny);
                ctx.stroke();
            }
            if (drawSeg < totalSeg && frac > 0.01) {
                const p1 = pts[drawSeg];
                const p2 = pts[drawSeg + 1];
                const fx = p1[0] + (p2[0] - p1[0]) * frac;
                const fy = p1[1] + (p2[1] - p1[1]) * frac;
                ctx.beginPath();
                ctx.moveTo(p1[0], p1[1]);
                ctx.lineTo(fx + (Math.random()-0.5)*0.8, fy + (Math.random()-0.5)*0.8);
                ctx.stroke();
            }
            ctx.restore();
        }

        // ============================================================
        // 6. FUNCIÓN PARA RELLENAR PIKACHU (después de dibujar)
        // ============================================================
        function fillPikachu() {
            // Relleno del cuerpo
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(pikaX - 50 * s, pikaY + 20 * s);
            ctx.quadraticCurveTo(pikaX - 65 * s, pikaY + 70 * s, pikaX - 40 * s, pikaY + 120 * s);
            ctx.quadraticCurveTo(pikaX, pikaY + 135 * s, pikaX + 40 * s, pikaY + 120 * s);
            ctx.quadraticCurveTo(pikaX + 65 * s, pikaY + 70 * s, pikaX + 50 * s, pikaY + 20 * s);
            ctx.closePath();
            ctx.fillStyle = PIKA_YELLOW;
            ctx.shadowColor = 'rgba(0,0,0,0.03)';
            ctx.shadowBlur = 6;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.restore();

            // Relleno de la cabeza
            ctx.save();
            ctx.beginPath();
            ctx.arc(pikaX, pikaY - 10 * s, 70 * s, 0, Math.PI * 2);
            ctx.fillStyle = PIKA_YELLOW;
            ctx.shadowColor = 'rgba(0,0,0,0.03)';
            ctx.shadowBlur = 6;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.restore();

            // Relleno de orejas
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(pikaX - 40 * s, pikaY - 50 * s);
            ctx.quadraticCurveTo(pikaX - 65 * s, pikaY - 110 * s, pikaX - 45 * s, pikaY - 125 * s);
            ctx.quadraticCurveTo(pikaX - 20 * s, pikaY - 60 * s, pikaX - 40 * s, pikaY - 50 * s);
            ctx.closePath();
            ctx.fillStyle = PIKA_YELLOW;
            ctx.fill();
            ctx.restore();

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(pikaX + 40 * s, pikaY - 50 * s);
            ctx.quadraticCurveTo(pikaX + 65 * s, pikaY - 110 * s, pikaX + 45 * s, pikaY - 125 * s);
            ctx.quadraticCurveTo(pikaX + 20 * s, pikaY - 60 * s, pikaX + 40 * s, pikaY - 50 * s);
            ctx.closePath();
            ctx.fillStyle = PIKA_YELLOW;
            ctx.fill();
            ctx.restore();

            // Relleno de mejillas
            ctx.save();
            ctx.beginPath();
            ctx.arc(pikaX - 48 * s, pikaY + 10 * s, 14 * s, 0, Math.PI * 2);
            ctx.fillStyle = PIKA_CHEEK;
            ctx.fill();
            ctx.restore();
            ctx.save();
            ctx.beginPath();
            ctx.arc(pikaX + 48 * s, pikaY + 10 * s, 14 * s, 0, Math.PI * 2);
            ctx.fillStyle = PIKA_CHEEK;
            ctx.fill();
            ctx.restore();

            // Relleno de ojos (negro)
            ctx.save();
            ctx.beginPath();
            ctx.arc(pikaX - 28 * s, pikaY - 18 * s, 14 * s, 0, Math.PI * 2);
            ctx.fillStyle = '#2d2a24';
            ctx.fill();
            ctx.restore();
            ctx.save();
            ctx.beginPath();
            ctx.arc(pikaX + 28 * s, pikaY - 18 * s, 14 * s, 0, Math.PI * 2);
            ctx.fillStyle = '#2d2a24';
            ctx.fill();
            ctx.restore();

            // Brillo de ojos (blanco)
            ctx.save();
            ctx.beginPath();
            ctx.arc(pikaX - 34 * s, pikaY - 24 * s, 5 * s, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.restore();
            ctx.save();
            ctx.beginPath();
            ctx.arc(pikaX + 22 * s, pikaY - 24 * s, 5 * s, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.restore();

            // Relleno de la cola
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(pikaX + 55 * s, pikaY + 100 * s);
            ctx.lineTo(pikaX + 95 * s, pikaY + 85 * s);
            ctx.lineTo(pikaX + 115 * s, pikaY + 55 * s);
            ctx.lineTo(pikaX + 100 * s, pikaY + 45 * s);
            ctx.lineTo(pikaX + 85 * s, pikaY + 65 * s);
            ctx.lineTo(pikaX + 75 * s, pikaY + 75 * s);
            ctx.lineTo(pikaX + 60 * s, pikaY + 90 * s);
            ctx.closePath();
            ctx.fillStyle = PIKA_YELLOW;
            ctx.fill();
            ctx.restore();

            // Rayas marrones en la espalda
            ctx.save();
            ctx.strokeStyle = PIKA_BROWN;
            ctx.lineWidth = 4 * s;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(pikaX - 10 * s, pikaY + 60 * s);
            ctx.lineTo(pikaX - 15 * s, pikaY + 80 * s);
            ctx.lineTo(pikaX - 5 * s, pikaY + 90 * s);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(pikaX + 10 * s, pikaY + 60 * s);
            ctx.lineTo(pikaX + 15 * s, pikaY + 80 * s);
            ctx.lineTo(pikaX + 5 * s, pikaY + 90 * s);
            ctx.stroke();
            ctx.restore();

            // Punta negra de las orejas
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(pikaX - 45 * s, pikaY - 125 * s);
            ctx.quadraticCurveTo(pikaX - 55 * s, pikaY - 115 * s, pikaX - 50 * s, pikaY - 100 * s);
            ctx.quadraticCurveTo(pikaX - 40 * s, pikaY - 110 * s, pikaX - 45 * s, pikaY - 125 * s);
            ctx.closePath();
            ctx.fillStyle = '#2d2a24';
            ctx.fill();
            ctx.restore();
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(pikaX + 45 * s, pikaY - 125 * s);
            ctx.quadraticCurveTo(pikaX + 55 * s, pikaY - 115 * s, pikaX + 50 * s, pikaY - 100 * s);
            ctx.quadraticCurveTo(pikaX + 40 * s, pikaY - 110 * s, pikaX + 45 * s, pikaY - 125 * s);
            ctx.closePath();
            ctx.fillStyle = '#2d2a24';
            ctx.fill();
            ctx.restore();
        }

        // ============================================================
        // 7. DIBUJO DE LA LLAMA (con interacción de encendido)
        // ============================================================
        let flameOn = false;
        let flameFade = 0; // 0 = apagada, 1 = encendida

        function drawFlame(progress, flicker) {
            if (flameFade <= 0) return;
            const fx = cx;
            const fy = wickY - 14;
            const baseH = 50;
            const baseW = 28;
            const flick = 1 + 0.08 * Math.sin(flicker * 4) + 0.04 * Math.sin(flicker * 7);
            const h = baseH * flick * flameFade;
            const w = baseW * (0.7 + 0.3 * flameFade) * flick;

            // Resplandor
            if (flameFade > 0.1) {
                const grad = ctx.createRadialGradient(fx, fy - h*0.3, 0, fx, fy - h*0.3, w*1.6);
                grad.addColorStop(0, `rgba(255, 220, 150, ${0.3 * flameFade})`);
                grad.addColorStop(0.4, `rgba(255, 180, 80, ${0.15 * flameFade})`);
                grad.addColorStop(1, `rgba(255, 150, 50, 0)`);
                ctx.save();
                ctx.fillStyle = grad;
                ctx.shadowColor = 'transparent';
                ctx.beginPath();
                ctx.arc(fx, fy - h*0.3, w*1.6, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Llama exterior
            const grad2 = ctx.createRadialGradient(fx, fy - h*0.2, 0, fx, fy - h*0.3, w);
            grad2.addColorStop(0, `rgba(255, 255, 200, ${0.9 * flameFade})`);
            grad2.addColorStop(0.3, `rgba(255, 200, 80, ${0.9 * flameFade})`);
            grad2.addColorStop(0.7, `rgba(255, 140, 30, ${0.8 * flameFade})`);
            grad2.addColorStop(1, `rgba(200, 80, 0, 0)`);
            ctx.save();
            ctx.shadowColor = `rgba(255, 150, 50, ${0.3 * flameFade})`;
            ctx.shadowBlur = 30;
            ctx.beginPath();
            ctx.moveTo(fx, fy - h);
            ctx.bezierCurveTo(fx + w*0.9, fy - h*0.4, fx + w*0.5, fy + h*0.1, fx, fy + h*0.1);
            ctx.bezierCurveTo(fx - w*0.5, fy + h*0.1, fx - w*0.9, fy - h*0.4, fx, fy - h);
            ctx.closePath();
            ctx.fillStyle = grad2;
            ctx.fill();
            ctx.restore();

            // Llama interior
            if (flameFade > 0.2) {
                const p2 = Math.min(1, (flameFade - 0.2) / 0.8);
                const h2 = h * 0.5 * p2;
                const w2 = w * 0.4 * p2;
                ctx.save();
                ctx.shadowColor = `rgba(255, 200, 100, ${0.5 * flameFade})`;
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.moveTo(fx, fy - h2 - 4);
                ctx.bezierCurveTo(fx + w2*0.8, fy - h2*0.4, fx + w2*0.4, fy + h2*0.1, fx, fy + h2*0.1);
                ctx.bezierCurveTo(fx - w2*0.4, fy + h2*0.1, fx - w2*0.8, fy - h2*0.4, fx, fy - h2 - 4);
                ctx.closePath();
                ctx.fillStyle = `rgba(255, 255, 255, ${0.9 * flameFade})`;
                ctx.fill();
                ctx.restore();
            }

            // Contorno a lápiz de la llama
            ctx.save();
            ctx.strokeStyle = PENCIL;
            ctx.lineWidth = 1.5;
            ctx.globalAlpha = Math.min(1, flameFade * 1.2);
            ctx.beginPath();
            ctx.moveTo(fx, fy - h);
            ctx.bezierCurveTo(fx + w*0.9, fy - h*0.4, fx + w*0.5, fy + h*0.1, fx, fy + h*0.1);
            ctx.bezierCurveTo(fx - w*0.5, fy + h*0.1, fx - w*0.9, fy - h*0.4, fx, fy - h);
            ctx.closePath();
            ctx.stroke();
            ctx.restore();
        }

        // ============================================================
        // 8. DETECCIÓN DE CLIC EN LA LLAMA
        // ============================================================
        function isInsideFlame(mx, my) {
            const fx = cx;
            const fy = wickY - 14 - 20;
            const dx = mx - fx;
            const dy = my - fy;
            return (dx * dx + dy * dy) < 900;
        }

        // ============================================================
        // 9. BUCLE PRINCIPAL DE ANIMACIÓN
        // ============================================================
        let startTime = performance.now();
        const DRAW_DURATION = 4500;
        let isComplete = false;
        let pikaDrawn = false;
        let animFrame;
        let flameClickable = false;

        function animate(now) {
            const elapsed = now - startTime;
            let progress = Math.min(1, elapsed / DRAW_DURATION);

            // Limpiar canvas
            ctx.clearRect(0, 0, SIZE, SIZE);
            ctx.fillStyle = PAPER;
            ctx.fillRect(0, 0, SIZE, SIZE);

            // Textura de papel
            ctx.save();
            ctx.globalAlpha = 0.04;
            for (let i = 0; i < 300; i++) {
                const x = Math.random() * SIZE;
                const y = Math.random() * SIZE;
                const r = Math.random() * 1.5;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fillStyle = '#b5aa99';
                ctx.fill();
            }
            ctx.restore();

            // Dibujar trazos
            const progressPerPath = 1 / totalPaths;
            for (let i = 0; i < totalPaths; i++) {
                const pathStart = i / totalPaths;
                const pathEnd = (i + 1) / totalPaths;
                let pathProgress = 0;
                if (progress >= pathEnd) pathProgress = 1;
                else if (progress > pathStart) pathProgress = (progress - pathStart) / (1 / totalPaths);
                let color = PENCIL;
                let lineW = 2.2;
                if (i > totalPaths - 20) { // trazos de Pikachu más suaves
                    color = PENCIL_LIGHT;
                    lineW = 1.8;
                }
                if (pathProgress > 0) drawPath(paths[i], pathProgress, color, lineW);
            }

            // Estado del dibujo
            if (progress >= 1) {
                if (!isComplete) {
                    isComplete = true;
                    // Rellenar Pikachu
                    fillPikachu();
                    pikaDrawn = true;
                    flameClickable = true;
                    statusLabel.textContent = '🕯️ ¡Toca la vela para encenderla!';
                    statusLabel.style.color = '#b5838d';
                }

                // Dibujar llama (si está encendida)
                if (flameOn || flameFade > 0) {
                    drawFlame(1, now / 100);
                }
            } else {
                const percent = Math.round(progress * 100);
                statusLabel.textContent = `✏️ dibujando ${percent}%`;
            }

            animFrame = requestAnimationFrame(animate);
        }

        // ============================================================
        // 10. EVENTOS DE INTERACCIÓN
        // ============================================================
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mx = (e.clientX - rect.left) * scaleX;
            const my = (e.clientY - rect.top) * scaleY;

            // Verificar clic en la llama (solo si está dibujado y la llama está apagada)
            if (isComplete && flameClickable && !flameOn) {
                if (isInsideFlame(mx, my)) {
                    // Encender llama con animación
                    flameOn = true;
                    flameClickable = false;
                    statusLabel.textContent = '🔥 ¡La llama se encendió!';
                    statusLabel.style.color = '#e67e22';
                    // Animación de fade-in
                    let fade = 0;
                    const fadeInterval = setInterval(() => {
                        fade += 0.05;
                        flameFade = Math.min(1, fade);
                        if (flameFade >= 1) {
                            clearInterval(fadeInterval);
                            setTimeout(() => {
                                statusLabel.textContent = '🎂 ¡Feliz Cumpleaños! 🎂';
                                statusLabel.style.color = '#b5838d';
                            }, 1000);
                        }
                    }, 30);
                    return;
                }
            }
        });

        // Doble clic para reiniciar todo
        canvas.addEventListener('dblclick', () => {
            if (animFrame) cancelAnimationFrame(animFrame);
            startTime = performance.now();
            isComplete = false;
            pikaDrawn = false;
            flameOn = false;
            flameFade = 0;
            flameClickable = false;
            statusLabel.textContent = '✏️ dibujando pastel...';
            statusLabel.style.color = '#b5aa99';
            animate(performance.now());
        });

        // ============================================================
        // 11. RESPONSIVE
        // ============================================================
        function resizeCanvas() {
            const container = canvas.parentElement;
            const maxW = window.innerWidth - 32;
            const maxH = window.innerHeight - 32;
            const containerSize = Math.min(maxW, maxH, 600);
            canvas.style.width = containerSize + 'px';
            canvas.style.height = containerSize + 'px';
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Ajustes para móvil
        if (window.innerWidth < 500) {
            document.querySelector('.status').style.fontSize = '0.6rem';
        }

        // Iniciar
        animate(performance.now());

        window.addEventListener('beforeunload', () => {
            if (animFrame) cancelAnimationFrame(animFrame);
        });
        console.log('🎂 Pastel + Pikachu cargado. ¡Toca la llama para encenderla!');
    })();
</script>
</body>
</html>
