<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Happy Birthday ♡</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&family=ZCOOL+KuaiLe&display=swap');

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.8), transparent 30%),
        radial-gradient(circle at 80% 30%, rgba(255,220,225,.45), transparent 28%),
        #fffaf3;
      color: #5b4a4a;
      font-family: "Patrick Hand", "ZCOOL KuaiLe", sans-serif;
      overflow-x: hidden;
    }

    /* =========================
       Background decoration
    ========================= */

    .background {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .star,
    .heart,
    .dot {
      position: absolute;
      opacity: .55;
      animation: float 5s ease-in-out infinite;
    }

    .star {
      font-size: 22px;
    }

    .heart {
      font-size: 20px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #f4a6b5;
    }

    .s1 { left: 8%; top: 15%; animation-delay: 0s; }
    .s2 { left: 18%; top: 68%; animation-delay: 1s; }
    .s3 { right: 12%; top: 20%; animation-delay: 2s; }
    .s4 { right: 20%; top: 70%; animation-delay: .5s; }
    .s5 { left: 50%; top: 10%; animation-delay: 1.5s; }

    .h1 { left: 10%; top: 42%; animation-delay: .8s; }
    .h2 { right: 10%; top: 45%; animation-delay: 2s; }
    .h3 { right: 25%; top: 10%; animation-delay: 1s; }

    .d1 { left: 27%; top: 22%; }
    .d2 { right: 30%; top: 30%; }
    .d3 { left: 14%; top: 82%; }
    .d4 { right: 13%; top: 82%; }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(-4deg);
      }

      50% {
        transform: translateY(-12px) rotate(5deg);
      }
    }

    /* =========================
       Main
    ========================= */

    main {
      position: relative;
      z-index: 1;
      width: min(1100px, 94%);
      margin: auto;
      padding: 55px 0 80px;
      text-align: center;
    }

    /* =========================
       Header
    ========================= */

    .title-small {
      font-size: 20px;
      letter-spacing: 5px;
      color: #b18a8a;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: clamp(58px, 10vw, 110px);
      line-height: .9;
      color: #e895a6;
      text-shadow:
        2px 2px 0 #fff,
        4px 4px 0 rgba(232,149,166,.15);
      transform: rotate(-2deg);
    }

    .subtitle {
      margin: 22px auto 0;
      font-size: 22px;
      color: #826b6b;
      max-width: 600px;
    }

    /* =========================
       Main illustration
    ========================= */

    .scene {
      position: relative;
      margin: 40px auto 0;
      width: min(900px, 100%);
      min-height: 600px;
    }

    .cake-area {
      position: absolute;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      width: min(430px, 70vw);
    }

    /* cake shadow */

    .cake-shadow {
      width: 100%;
      height: 35px;
      background: rgba(110,80,80,.08);
      border-radius: 50%;
      margin-top: -4px;
    }

    /* cake */

    .cake {
      position: relative;
      margin: auto;
      width: 90%;
    }

    .cake-top {
      position: relative;
      height: 90px;
      background: #fff6ef;
      border: 4px solid #674d4d;
      border-radius: 50%;
      z-index: 3;
    }

    .cake-top::after {
      content: "";
      position: absolute;
      inset: 18px 35px;
      border: 3px dashed #f2a6b5;
      border-radius: 50%;
    }

    .cake-body {
      position: relative;
      margin: -35px auto 0;
      width: 94%;
      height: 155px;
      background: #ffdce2;
      border: 4px solid #674d4d;
      border-top: none;
      border-radius: 0 0 35px 35px;
      z-index: 2;
      overflow: hidden;
    }

    .cream {
      position: absolute;
      top: 0;
      left: -5%;
      width: 110%;
      height: 48px;
      background: #fff8ef;
      border-bottom: 4px solid #674d4d;
      border-radius: 0 0 50% 50%;
    }

    .cream::before,
    .cream::after {
      content: "";
      position: absolute;
      bottom: -18px;
      width: 30px;
      height: 30px;
      background: #fff8ef;
      border-radius: 50%;
      border: 4px solid #674d4d;
    }

    .cream::before {
      left: 25%;
    }

    .cream::after {
      right: 25%;
    }

    .berry {
      position: absolute;
      width: 15px;
      height: 15px;
      background: #e98b9e;
      border: 3px solid #674d4d;
      border-radius: 50%;
    }

    .b1 { left: 18%; top: 75px; }
    .b2 { left: 38%; top: 110px; }
    .b3 { right: 25%; top: 80px; }
    .b4 { right: 12%; top: 120px; }

    .cake-bottom {
      width: 100%;
      height: 28px;
      margin-top: -3px;
      background: #fff6ef;
      border: 4px solid #674d4d;
      border-radius: 50%;
      position: relative;
      z-index: 4;
    }

    /* =========================
       Candles
    ========================= */

    .candles {
      position: absolute;
      left: 50%;
      top: -105px;
      transform: translateX(-50%);
      display: flex;
      gap: 28px;
      z-index: 10;
    }

    .candle {
      position: relative;
      width: 22px;
      height: 92px;
      background:
        repeating-linear-gradient(
          -45deg,
          #f4a5b6 0,
          #f4a5b6 7px,
          #fff5ee 7px,
          #fff5ee 14px
        );
      border: 3px solid #674d4d;
      border-radius: 5px 5px 3px 3px;
    }

    .wick {
      position: absolute;
      width: 3px;
      height: 12px;
      background: #674d4d;
      top: -13px;
      left: 50%;
      transform: translateX(-50%);
    }

    .flame {
      position: absolute;
      left: 50%;
      top: -46px;
      width: 23px;
      height: 34px;
      transform: translateX(-50%) scale(0);
      transform-origin: bottom center;
      opacity: 0;
      transition: .25s;
    }

    .flame::before {
      content: "";
      position: absolute;
      inset: 0;
      background: #ffc95d;
      border: 3px solid #674d4d;
      border-radius: 55% 45% 55% 45%;
      transform: rotate(8deg);
    }

    .flame::after {
      content: "";
      position: absolute;
      width: 9px;
      height: 15px;
      background: #fff8d8;
      border-radius: 50%;
      left: 7px;
      top: 10px;
    }

    .candle.lit .flame {
      transform: translateX(-50%) scale(1);
      opacity: 1;
      animation: flame 0.7s ease-in-out infinite alternate;
    }

    @keyframes flame {
      from {
        transform: translateX(-50%) scale(1) rotate(-3deg);
      }
      to {
        transform: translateX(-50%) scale(1.08) rotate(4deg);
      }
    }

    /* =========================
       Pokémon line art
    ========================= */

    .pokemon {
      position: absolute;
      width: 210px;
      height: 230px;
      filter: drop-shadow(0 5px 0 rgba(80,50,50,.04));
      animation: pokemonFloat 4s ease-in-out infinite;
    }

    .pokemon svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .pokemon path,
    .pokemon circle,
    .pokemon ellipse,
    .pokemon line,
    .pokemon polyline {
      fill: #fffaf3;
      stroke: #674d4d;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .pokemon .detail {
      fill: none;
    }

    .pokemon .black {
      fill: #674d4d;
      stroke: none;
    }

    .pikachu {
      left: 2%;
      bottom: 80px;
      transform: rotate(-5deg);
    }

    .eevee {
      right: 2%;
      bottom: 65px;
      transform: rotate(5deg);
      animation-delay: 1s;
    }

    .jiggly {
      left: 8%;
      top: 35px;
      width: 150px;
      height: 160px;
      animation-delay: 1.5s;
    }

    .snorlax {
      right: 8%;
      top: 30px;
      width: 180px;
      height: 170px;
      animation-delay: .7s;
    }

    @keyframes pokemonFloat {
      0%, 100% {
        margin-top: 0;
      }

      50% {
        margin-top: -10px;
      }
    }

    /* =========================
       Wish button
    ========================= */

    .wish-button {
      position: relative;
      z-index: 20;
      margin-top: 25px;
      padding: 14px 30px;
      border: 3px solid #674d4d;
      border-radius: 999px;
      background: #ffdce2;
      color: #674d4d;
      font-family: inherit;
      font-size: 22px;
      cursor: pointer;
      transition: .2s;
      box-shadow: 0 5px 0 #dca2ad;
    }

    .wish-button:hover {
      transform: translateY(-3px);
    }

    .wish-button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #dca2ad;
    }

    /* =========================
       Message card
    ========================= */

    .message {
      width: min(680px, 94%);
      margin: 55px auto 0;
      padding: 35px 30px;
      background: rgba(255,255,255,.65);
      border: 3px solid #674d4d;
      border-radius: 25px;
      position: relative;
      box-shadow: 7px 7px 0 rgba(103,77,77,.08);
    }

    .message::before {
      content: "♡";
      position: absolute;
      right: 20px;
      top: -25px;
      font-size: 48px;
      color: #ed9bac;
      transform: rotate(15deg);
    }

    .message h2 {
      margin: 0 0 15px;
      font-size: 34px;
      color: #e48d9e;
    }

    .message p {
      margin: 8px 0;
      font-size: 21px;
      line-height: 1.7;
    }

    .signature {
      margin-top: 22px !important;
      color: #a17c7c;
    }

    /* =========================
       Confetti
    ========================= */

    .confetti {
      position: fixed;
      width: 9px;
      height: 18px;
      top: -30px;
      z-index: 100;
      pointer-events: none;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform:
          translateY(110vh)
          rotate(720deg);
        opacity: 0;
      }
    }

    /* =========================
       Mobile
    ========================= */

    @media (max-width: 700px) {

      main {
        padding-top: 35px;
      }

      h1 {
        font-size: 65px;
      }

      .subtitle {
        font-size: 18px;
      }

      .scene {
        min-height: 500px;
      }

      .cake-area {
        width: 320px;
        bottom: 40px;
      }

      .pokemon {
        transform: scale(.65);
      }

      .pikachu {
        left: -40px;
        bottom: 45px;
      }

      .eevee {
        right: -40px;
        bottom: 40px;
      }

      .jiggly {
        left: -25px;
        top: 10px;
      }

      .snorlax {
        right: -30px;
        top: 5px;
      }

      .candles {
        gap: 17px;
      }

      .message {
        margin-top: 30px;
        padding: 28px 20px;
      }

      .message h2 {
        font-size: 28px;
      }

      .message p {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <!-- Background -->
  <div class="background">
    <div class="star s1">✦</div>
    <div class="star s2">☆</div>
    <div class="star s3">✦</div>
    <div class="star s4">☆</div>
    <div class="star s5">✧</div>

    <div class="heart h1">♡</div>
    <div class="heart h2">♥</div>
    <div class="heart h3">♡</div>

    <div class="dot d1"></div>
    <div class="dot d2"></div>
    <div class="dot d3"></div>
    <div class="dot d4"></div>
  </div>


  <main>

    <div class="title-small">
      A LITTLE CELEBRATION FOR YOU
    </div>

    <h1>Happy<br>Birthday!</h1>

    <p class="subtitle">
      今天的所有星星，都偷偷跑来为你庆祝啦 ✦
    </p>


    <!-- =========================
         Illustration Scene
    ========================== -->

    <section class="scene">

      <!-- Jigglypuff -->
      <div class="pokemon jiggly">
        <svg viewBox="0 0 180 170">

          <!-- body -->
          <circle cx="90" cy="90" r="55"/>

          <!-- ears -->
          <polyline points="50,50 35,20 65,35"/>
          <polyline points="130,50 145,20 115,35"/>

          <!-- eyes -->
          <ellipse cx="70" cy="88" rx="8" ry="13"/>
          <ellipse cx="110" cy="88" rx="8" ry="13"/>

          <circle class="black" cx="70" cy="90" r="3"/>
          <circle class="black" cx="110" cy="90" r="3"/>

          <!-- mouth -->
          <path class="detail"
                d="M82 110 Q90 118 98 110"/>

          <!-- cheeks -->
          <circle cx="48" cy="105" r="8"/>
          <circle cx="132" cy="105" r="8"/>

          <!-- curl -->
          <path class="detail"
                d="M90 42 Q110 25 125 40"/>

        </svg>
      </div>


      <!-- Snorlax -->
      <div class="pokemon snorlax">
        <svg viewBox="0 0 200 180">

          <ellipse cx="100" cy="110" rx="65" ry="48"/>

          <!-- head -->
          <path d="M55 75 Q60 25 100 30 Q140 25 145 75"/>

          <!-- ears -->
          <path d="M55 55 L40 35 L62 42"/>
          <path d="M145 55 L160 35 L138 42"/>

          <!-- eyes -->
          <path class="detail"
                d="M70 70 Q78 65 84 70"/>
          <path class="detail"
                d="M116 70 Q124 65 130 70"/>

          <!-- nose -->
          <path d="M94 82 Q100 76 106 82 L100 87 Z"/>

          <!-- mouth -->
          <path class="detail"
                d="M88 92 Q100 104 112 92"/>

          <!-- belly -->
          <ellipse cx="100" cy="125" rx="38" ry="25"/>

          <!-- arms -->
          <path d="M45 100 Q20 105 28 125 Q35 135 50 125"/>
          <path d="M155 100 Q180 105 172 125 Q165 135 150 125"/>

        </svg>
      </div>


      <!-- Pikachu -->
      <div class="pokemon pikachu">
        <svg viewBox="0 0 220 240">

          <!-- body -->
          <ellipse cx="110" cy="145" rx="48" ry="65"/>

          <!-- head -->
          <ellipse cx="110" cy="82" rx="58" ry="52"/>

          <!-- ears -->
          <path d="M70 45 L38 8 L50 70"/>
          <path d="M150 45 L182 8 L170 70"/>

          <!-- ear tips -->
          <path d="M38 8 L48 25"/>
          <path d="M182 8 L172 25"/>

          <!-- eyes -->
          <circle cx="88" cy="82" r="7"/>
          <circle cx="132" cy="82" r="7"/>

          <!-- cheeks -->
          <circle cx="62" cy="108" r="13"/>
          <circle cx="158" cy="108" r="13"/>

          <!-- mouth -->
          <path class="detail"
                d="M98 100 Q110 112 122 100"/>

          <!-- arms -->
          <path d="M68 140 Q35 130 30 150 Q30 165 62 163"/>
          <path d="M152 140 Q185 130 190 150 Q190 165 158 163"/>

          <!-- feet -->
          <ellipse cx="80" cy="207" rx="22" ry="10"/>
          <ellipse cx="140" cy="207" rx="22" ry="10"/>

          <!-- tail -->
          <polyline points="160,160 190,150 175,130 205,115"/>

        </svg>
      </div>


      <!-- Eevee -->
      <div class="pokemon eevee">
        <svg viewBox="0 0 220 230">

          <!-- body -->
          <ellipse cx="110" cy="160" rx="55" ry="55"/>

          <!-- head -->
          <ellipse cx="110" cy="90" rx="60" ry="55"/>

          <!-- ears -->
          <path d="M65 55 L35 8 L80 35"/>
          <path d="M155 55 L185 8 L140 35"/>

          <!-- eyes -->
          <ellipse cx="87" cy="92" rx="7" ry="10"/>
          <ellipse cx="133" cy="92" rx="7" ry="10"/>

          <!-- nose -->
          <circle cx="110" cy="108" r="5"/>

          <!-- mouth -->
          <path class="detail"
                d="M100 116 Q110 126 120 116"/>

          <!-- fluffy collar -->
          <path d="
            M60 130
            Q75 115 90 132
            Q110 115 130 132
            Q145 115 160 130
            Q145 155 110 150
            Q75 155 60 130
          "/>

          <!-- arms -->
          <path d="M62 155 Q35 160 42 180 Q48 190 70 175"/>
          <path d="M158 155 Q185 160 178 180 Q172 190 150 175"/>

          <!-- feet -->
          <ellipse cx="82" cy="210" rx="25" ry="10"/>
          <ellipse cx="138" cy="210" rx="25" ry="10"/>

        </svg>
      </div>


      <!-- Cake -->
      <div class="cake-area">

        <div class="candles">

          <div class="candle">
            <div class="wick"></div>
            <div class="flame"></div>
          </div>

          <div class="candle">
            <div class="wick"></div>
            <div class="flame"></div>
          </div>

          <div class="candle">
            <div class="wick"></div>
            <div class="flame"></div>
          </div>

          <div class="candle">
            <div class="wick"></div>
            <div class="flame"></div>
          </div>

          <div class="candle">
            <div class="wick"></div>
            <div class="flame"></div>
          </div>

        </div>


        <div class="cake">

          <div class="cake-top"></div>

          <div class="cake-body">
            <div class="cream"></div>

            <div class="berry b1"></div>
            <div class="berry b2"></div>
            <div class="berry b3"></div>
            <div class="berry b4"></div>
          </div>

          <div class="cake-bottom"></div>

        </div>

        <div class="cake-shadow"></div>

      </div>

    </section>


    <!-- Button -->

    <button class="wish-button" id="wishButton">
      🕯️ 点燃蜡烛 · Make a Wish
    </button>


    <!-- Message -->

    <section class="message">

      <h2>To You ♡</h2>

      <p>
        愿新的一岁，
      </p>

      <p>
        有很多很多开心的事情发生。
      </p>

      <p>
        愿你遇见温柔的人，看到漂亮的风景，
        也一直有勇气去追逐自己喜欢的东西。
      </p>

      <p>
        愿所有期待，都慢慢变成惊喜。
      </p>

      <p class="signature">
        And of course...<br>
        祝你生日快乐！🎂✨
      </p>

    </section>

  </main>


  <script>

    const button = document.getElementById("wishButton");
    const candles = document.querySelectorAll(".candle");

    let lit = false;

    button.addEventListener("click", () => {

      lit = !lit;

      candles.forEach((candle, index) => {

        setTimeout(() => {
          candle.classList.toggle("lit", lit);
        }, index * 100);

      });

      if (lit) {

        button.innerHTML = "✨ 蜡烛已经点亮 · Make a Wish!";

      } else {

        button.innerHTML = "🕯️ 点燃蜡烛 · Make a Wish";

      }

    });


    /* =========================
       Confetti
    ========================== */

    function createConfetti() {

      for (let i = 0; i < 35; i++) {

        const confetti = document.createElement("div");

        confetti.className = "confetti";

        confetti.style.left =
          Math.random() * 100 + "vw";

        confetti.style.animationDuration =
          (3 + Math.random() * 4) + "s";

        confetti.style.animationDelay =
          Math.random() * 2 + "s";

        const rotation =
          Math.random() * 360;

        confetti.style.transform =
          `rotate(${rotation}deg)`;

        document.body.appendChild(confetti);

        setTimeout(() => {
          confetti.remove();
        }, 8000);
      }
    }


    /* =========================
       Birthday surprise
    ========================== */

    let surpriseShown = false;

    button.addEventListener("click", () => {

      if (!surpriseShown && !lit) {

        surpriseShown = true;

        setTimeout(() => {

          createConfetti();

          const message =
            document.querySelector(".message");

          message.animate(
            [
              {
                transform: "scale(1)"
              },
              {
                transform: "scale(1.04)"
              },
              {
                transform: "scale(1)"
              }
            ],
            {
              duration: 700,
              easing: "ease-out"
            }
          );

        }, 200);

      }

    });


    /* =========================
       Initial tiny sparkle
    ========================== */

    window.addEventListener("load", () => {

      setTimeout(() => {

        createConfetti();

      }, 700);

    });

  </script>

</body>
</html>
