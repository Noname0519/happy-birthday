<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎂 生日快乐！</title>
    <style>
        /* ===== 全局样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0b0e2a 0%, #1a1f4e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Poppins', sans-serif;
            overflow: hidden;
            position: relative;
            user-select: none;
        }

        /* ===== 标题 ===== */
        .title {
            font-size: 3.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #feda75, #ffb347, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 200, 100, 0.3);
            letter-spacing: 4px;
            margin-bottom: 20px;
            animation: glowPulse 2s ease-in-out infinite alternate;
        }
        @keyframes glowPulse {
            0% { text-shadow: 0 0 10px rgba(255, 200, 100, 0.2); }
            100% { text-shadow: 0 0 40px rgba(255, 200, 100, 0.8), 0 0 80px rgba(255, 100, 50, 0.4); }
        }

        /* ===== 蛋糕容器 ===== */
        .cake-container {
            position: relative;
            width: 300px;
            height: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            margin-bottom: 30px;
        }

        /* ----- 蛋糕层 (从下往上) ----- */
        .layer {
            width: 100%;
            border-radius: 12px 12px 4px 4px;
            position: relative;
        }
        .layer-bottom {
            height: 70px;
            background: linear-gradient(180deg, #c27a5a, #a85f3f);
            border-bottom: 6px solid #8a4e32;
        }
        .layer-middle {
            height: 60px;
            width: 85%;
            background: linear-gradient(180deg, #e8b88a, #d49a6a);
            border-bottom: 6px solid #b87a52;
            margin-bottom: -4px;
            border-radius: 10px 10px 2px 2px;
        }
        .layer-top {
            height: 50px;
            width: 70%;
            background: linear-gradient(180deg, #f5d5b0, #eac09a);
            border-bottom: 6px solid #d4a880;
            margin-bottom: -4px;
            border-radius: 10px 10px 2px 2px;
        }

        /* ----- 奶油装饰 (波浪) ----- */
        .cream {
            position: absolute;
            top: -12px;
            left: 0;
            width: 100%;
            height: 16px;
            background: repeating-conic-gradient(#fff9f0 0% 8%, #fce8d0 8% 16%);
            border-radius: 50%;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }
        .layer-middle .cream { top: -10px; height: 14px; }
        .layer-top .cream { top: -8px; height: 12px; }

        /* ----- 蜡烛 ----- */
        .candle {
            position: absolute;
            bottom: 115px; /* 置于顶层之上 */
            left: 50%;
            transform: translateX(-50%);
            width: 18px;
            height: 55px;
            background: linear-gradient(180deg, #ff99aa, #ff667a);
            border-radius: 6px 6px 2px 2px;
            box-shadow: inset -3px 0 8px rgba(0,0,0,0.15);
            z-index: 5;
        }
        .candle::after {
            content: '';
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 8px;
            background: #333;
            border-radius: 50%;
        }
        /* 蜡烛条纹 */
        .candle-stripe {
            position: absolute;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.3);
            top: 20px;
        }
        .candle-stripe:nth-child(2) { top: 35px; }

        /* ----- 火焰 (动态闪光) ----- */
        .flame {
            position: absolute;
            bottom: 165px; /* 蜡烛顶端上方 */
            left: 50%;
            transform: translateX(-50%);
            width: 22px;
            height: 30px;
            background: radial-gradient(circle at 30% 30%, #ffdd44, #ff8800);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            box-shadow: 0 0 40px 12px rgba(255, 150, 0, 0.6);
            animation: flicker 0.15s infinite alternate ease-in-out;
            z-index: 6;
            filter: blur(0.5px);
        }
        .flame::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 4px;
            width: 12px;
            height: 18px;
            background: radial-gradient(circle at 40% 20%, #fff8c0, #ffaa33);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            filter: blur(1px);
            opacity: 0.8;
            animation: flicker2 0.2s infinite alternate;
        }
        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1, 1) rotate(-2deg); }
            100% { transform: translateX(-50%) scale(1.08, 0.9) rotate(2deg); }
        }
        @keyframes flicker2 {
            0% { transform: scale(1, 1) rotate(-1deg); }
            100% { transform: scale(1.2, 0.8) rotate(2deg); }
        }

        /* ----- 闪光星星 (用JS生成) ----- */
        .star {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 12px 4px rgba(255, 255, 200, 0.7);
            animation: twinkle 0.8s infinite alternate;
            pointer-events: none;
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.6); }
            100% { opacity: 1; transform: scale(1.4); }
        }

        /* ----- 纸屑 (用JS生成) ----- */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            animation: fall linear infinite;
            pointer-events: none;
            opacity: 0.9;
        }
        @keyframes fall {
            0% { transform: translateY(-20px) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg) scale(0.3); opacity: 0.2; }
        }

        /* ===== 底部祝福语 ===== */
        .sub-message {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 2px;
            margin-top: 10px;
            animation: fadeIn 3s ease-out;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ===== 响应式 ===== */
        @media (max-width: 500px) {
            .title { font-size: 2.2rem; }
            .cake-container { width: 230px; height: 280px; }
            .layer-bottom { height: 55px; }
            .layer-middle { height: 48px; }
            .layer-top { height: 40px; }
            .candle { height: 45px; width: 14px; bottom: 95px; }
            .flame { width: 18px; height: 26px; bottom: 135px; }
        }
    </style>
</head>
<body>

    <div class="title">✨ 生日快乐 ✨</div>

    <!-- 蛋糕主体 -->
    <div class="cake-container" id="cakeContainer">
        <!-- 底层 -->
        <div class="layer layer-bottom">
            <div class="cream"></div>
        </div>
        <!-- 中层 -->
        <div class="layer layer-middle">
            <div class="cream"></div>
        </div>
        <!-- 顶层 -->
        <div class="layer layer-top">
            <div class="cream"></div>
        </div>

        <!-- 蜡烛 -->
        <div class="candle">
            <div class="candle-stripe"></div>
            <div class="candle-stripe"></div>
        </div>
        <!-- 火焰 -->
        <div class="flame" id="flame"></div>
    </div>

    <div class="sub-message">🎉 愿所有美好都如期而至 🎉</div>

    <script>
        // ============================================================
        // 1. 生成闪烁的星星 (围绕蛋糕)
        // ============================================================
        (function createStars() {
            const container = document.getElementById('cakeContainer');
            const starCount = 30;
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                // 随机位置 (相对于容器)
                const x = Math.random() * 100; // %
                const y = Math.random() * 100;
                star.style.left = x + '%';
                star.style.top = y + '%';
                // 随机尺寸
                const size = 4 + Math.random() * 8;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                // 随机动画延迟
                star.style.animationDelay = (Math.random() * 2) + 's';
                // 随机颜色 (暖色调)
                const hue = 40 + Math.random() * 20;
                star.style.background = `hsl(${hue}, 100%, 85%)`;
                star.style.boxShadow = `0 0 20px 6px hsl(${hue}, 100%, 70%)`;
                container.appendChild(star);
            }
        })();

        // ============================================================
        // 2. 飘落的彩色纸屑 (Confetti)
        // ============================================================
        (function createConfetti() {
            const container = document.getElementById('cakeContainer');
            const colors = ['#ff6b6b', '#ffb347', '#feda75', '#6bcbff', '#b88aff', '#ff6b9d'];
            const count = 40;
            for (let i = 0; i < count; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                // 随机位置 (从容器顶部开始)
                const x = Math.random() * 100;
                confetti.style.left = x + '%';
                confetti.style.top = '-10%';
                // 随机颜色
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                // 随机形状 (矩形或圆形)
                if (Math.random() > 0.5) {
                    confetti.style.borderRadius = '50%';
                }
                // 随机尺寸
                const w = 6 + Math.random() * 10;
                const h = 6 + Math.random() * 10;
                confetti.style.width = w + 'px';
                confetti.style.height = h + 'px';
                // 随机动画时长 (3~6秒)
                const duration = 4 + Math.random() * 4;
                confetti.style.animationDuration = duration + 's';
                // 随机延迟
                confetti.style.animationDelay = (Math.random() * 3) + 's';
                container.appendChild(confetti);
            }
        })();

        // ============================================================
        // 3. (可选) 点击蛋糕时触发更多闪光
        // ============================================================
        document.querySelector('.cake-container').addEventListener('click', function(e) {
            // 产生一个爆裂的闪光效果 —— 动态创建临时星星
            for (let i = 0; i < 20; i++) {
                const spark = document.createElement('div');
                spark.style.cssText = `
                            position: absolute;
                            width: 6px; height: 6px;
                            background: #fff;
                            border-radius: 50%;
                            box-shadow: 0 0 20px 6px rgba(255, 200, 100, 0.9);
                            pointer-events: none;
                            left: ${e.offsetX}px;
                            top: ${e.offsetY}px;
                            transition: all 0.6s cubic-bezier(0, 0.8, 0.5, 1);
                        `;
                this.appendChild(spark);
                // 随机飞散
                const angle = Math.random() * 2 * Math.PI;
                const dist = 40 + Math.random() * 80;
                const dx = Math.cos(angle) * dist;
                const dy = Math.sin(angle) * dist - 30;
                requestAnimationFrame(() => {
                    spark.style.transform = `translate(${dx}px, ${dy}px) scale(0)`;
                    spark.style.opacity = '0';
                });
                setTimeout(() => spark.remove(), 700);
            }
        });
    </script>
</body>
</html>
